{% extends 'parent/base.html' %}
{% block title %}reset password{% endblock %}

{% block content %}
<h1>Reset Password</h1>
    {% if validlink %}
<p>Please enter your password twice for confirmation.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Reset Password">
    </form>
    {% else %}
        Your password reset link in not valid.
    {% endif %}
{% endblock %}

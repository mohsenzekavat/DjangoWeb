<h1>Login</h1>
<p>Please enter your username and password</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <input type="submit" value="Login">
    </form>
    <p><a href="{% url 'blog:password_reset' %}">Forgot Password?</a></p> {# Wrapped in <p> for consistent styling #}

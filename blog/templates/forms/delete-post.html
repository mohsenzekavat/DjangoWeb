{% extends 'parent/base.html' %}
{% block title %}post delete{% endblock %}
{% block content %}

        {% csrf_token %}
        <a href="{% url 'blog:profile' %}">Return to profile</a>
        <br>
        <input type="submit" value="Delete">
    </form>
{% endblock %}
